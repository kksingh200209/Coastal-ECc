name: Build Coastal ECC Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, mobile-dashboard-apk]
    paths: ['mobile-dashboard/**', '.github/workflows/coastal-ecc-android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-dashboard/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        working-directory: mobile-dashboard
        run: npm install
      - name: Generate web catalog
        working-directory: mobile-dashboard
        run: npm run build
      - name: Add Android platform and sync
        working-directory: mobile-dashboard
        run: npx cap add android && npx cap sync android
      - name: Build debug APK
        working-directory: mobile-dashboard/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Coastal-ECC-debug-apk
          path: mobile-dashboard/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
